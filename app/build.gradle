plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.roassistente'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.roassistente'
        minSdk 23
        // Prototype target. This keeps system-bar behavior simple while testing.
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
